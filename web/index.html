<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chunk 浏览 · offset-source-of-chunks</title>
    <link rel="stylesheet" href="./base.css" />
    <style>
      main {
        display: grid;
        grid-template-columns: minmax(320px, 42%) 1fr;
        flex: 1;
        min-height: 0;
      }

      .list-pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid var(--border);
      }

      #filter {
        margin: 12px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--text);
        font-size: 13px;
        outline: none;
      }

      #filter:focus {
        border-color: var(--accent);
      }

      .list {
        flex: 1;
        overflow: auto;
        padding: 0 8px 12px;
      }

      .chunk {
        display: block;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .chunk:hover {
        background: var(--panel-2);
      }

      .chunk.active {
        border-color: var(--accent);
        background: var(--panel-2);
      }

      .chunk .idx {
        margin-right: 6px;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 12px;
      }

      .chunk .text {
        color: var(--text);
        word-break: break-word;
      }

      .chunk .meta {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
        font-family: var(--mono);
        word-break: break-all;
      }

      .view-pane {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }

      .view-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 16px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-size: 12px;
      }

      #view-title {
        color: var(--text);
        font-family: var(--mono);
        word-break: break-all;
      }

      #view-meta {
        color: var(--muted);
        font-family: var(--mono);
      }

      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: 45% 1fr;
        }

        .list-pane {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>LangChain 文档 chunk 浏览</h1>
      <span id="stats">加载中…</span>
      <nav>
        <a href="./article.html">引用式文章</a>
      </nav>
    </header>
    <main>
      <section class="list-pane">
        <input id="filter" type="search" placeholder="按内容 / 路径 / 标题过滤…" autocomplete="off" />
        <div id="list" class="list"></div>
      </section>
      <section class="view-pane">
        <div class="view-head">
          <span id="view-title">点击左侧 chunk 查看源文件</span>
          <span id="view-meta"></span>
        </div>
        <div id="source" class="source">
          <p class="hint">
            左侧列表来自 <code>data/chunks/chunks.jsonl</code>，点击任意 chunk 会在右侧打开源文件并定位到它的字符偏移位置。
          </p>
        </div>
      </section>
    </main>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
