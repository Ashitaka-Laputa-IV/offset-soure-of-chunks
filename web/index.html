<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chunk 浏览 · offset-source-of-chunks</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #161a21;
        --panel-2: #1c222b;
        --border: #262d38;
        --text: #dfe4ec;
        --muted: #8b96a8;
        --accent: #4c8dff;
        --hit: rgba(76, 141, 255, 0.14);
        --hit-border: #4c8dff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }

      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      #stats {
        color: var(--muted);
        font-size: 12px;
      }

      main {
        display: grid;
        grid-template-columns: minmax(320px, 42%) 1fr;
        flex: 1;
        min-height: 0;
      }

      .list-pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid var(--border);
      }

      #filter {
        margin: 12px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--text);
        font-size: 13px;
        outline: none;
      }

      #filter:focus {
        border-color: var(--accent);
      }

      .list {
        flex: 1;
        overflow: auto;
        padding: 0 8px 12px;
      }

      .chunk {
        display: block;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .chunk:hover {
        background: var(--panel-2);
      }

      .chunk.active {
        border-color: var(--accent);
        background: var(--panel-2);
      }

      .chunk .idx {
        color: var(--accent);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        margin-right: 6px;
      }

      .chunk .text {
        color: var(--text);
        word-break: break-word;
      }

      .chunk .meta {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        word-break: break-all;
      }

      .view-pane {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }

      .view-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 16px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-size: 12px;
      }

      #view-title {
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        word-break: break-all;
      }

      #view-meta {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .source {
        flex: 1;
        overflow: auto;
        padding: 8px 0 40vh;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12.5px;
        line-height: 1.6;
        tab-size: 2;
      }

      .source .hint {
        padding: 24px 16px;
        color: var(--muted);
      }

      .line {
        display: flex;
        border-left: 3px solid transparent;
      }

      .line .ln {
        flex: 0 0 56px;
        padding-right: 12px;
        color: #545f70;
        text-align: right;
        user-select: none;
      }

      .line .code {
        flex: 1;
        padding-right: 16px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .line.hit {
        background: var(--hit);
      }

      .line.hit-start {
        border-left-color: var(--hit-border);
      }

      .line.hit-start .ln {
        color: var(--accent);
      }

      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: 45% 1fr;
        }

        .list-pane {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>LangChain 文档 chunk 浏览</h1>
      <span id="stats">加载中…</span>
    </header>
    <main>
      <section class="list-pane">
        <input id="filter" type="search" placeholder="按内容 / 路径 / 标题过滤…" autocomplete="off" />
        <div id="list" class="list"></div>
      </section>
      <section class="view-pane">
        <div class="view-head">
          <span id="view-title">点击左侧 chunk 查看源文件</span>
          <span id="view-meta"></span>
        </div>
        <div id="source" class="source">
          <p class="hint">
            左侧列表来自 <code>data/chunks/chunks.jsonl</code>，点击任意 chunk 会在右侧打开源文件并定位到它的字符偏移位置。
          </p>
        </div>
      </section>
    </main>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
